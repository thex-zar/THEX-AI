name: build
on:
  push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix Android SDK + Python bug
        run: |
          sudo apt update
          sudo apt install -y aidl libffi-dev libssl-dev
          pip install cython==0.29.36 buildozer==1.5.0
          # Fix python3 to be 3.10 not 3.14
          sudo ln -sf /opt/hostedtoolcache/Python/3.10.21/x64/bin/python /usr/local/bin/python3
          sudo ln -sf /opt/hostedtoolcache/Python/3.10.21/x64/bin/python /usr/bin/python3.10 || true
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK --licenses
          $SDK "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl || true
          sudo chmod +x $ANDROID_HOME/build-tools/33.0.2/aidl || true
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/tools/bin
          echo '#!/bin/bash' > $ANDROID_HOME/tools/bin/sdkmanager
          echo 'exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"' >> $ANDROID_HOME/tools/bin/sdkmanager
          chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/lib $ANDROID_HOME/tools/lib 2>/dev/null || true
          yes | $SDK --licenses || true
          # PRE-CLONE and PATCH p4a pip bug
          rm -rf ~/.buildozer/android/platform/python-for-android
          git clone https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android
          sed -i 's/pip install -U pip/pip install pip==23.3.1/g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/build.py || true
          sed -i 's/--upgrade pip/==23.3.1/g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/build.py || true
          find ~/.buildozer/android/platform/python-for-android -type f -name "*.py" -exec sed -i 's/pip install -U pip/pip install pip==23.3.1/g' {} \; || true
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
