name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip libffi-dev libssl-dev libbz2-dev
          pip install cython==0.29.36 buildozer

      - name: Build with log capture
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug 2>&1 | tee my_build.txt; echo "DONE"
          echo "=== LAST 150 LINES OF ERROR ==="
          tail -n 150 my_build.txt
          echo "=== END ==="
          # fail if no apk
          ls bin/*.apk

      - name: Upload log snippet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my_build-log
          path: my_build.txt
