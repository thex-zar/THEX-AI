name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libffi-dev libssl-dev aidl
          pip install cython==0.29.36 buildozer
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platform-tools"
      - name: Fix aidl
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          cp /usr/bin/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || true
          cp /usr/bin/aidl $ANDROID_HOME/build-tools/37.0.0/aidl || true
          cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl || true
          chmod +x $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || true
      - name: Build APK
        run: |
          rm -rf .buildozer
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
