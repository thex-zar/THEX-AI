      - name: Fix Android SDK
        run: |
          sudo apt update
          sudo apt install -y aidl
          pip install cython==0.29.36 buildozer==1.5.0
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK --licenses
          $SDK "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl
          sudo chmod +x $ANDROID_HOME/build-tools/33.0.2/aidl
          # --- THE BRIDGE BUILDER ---
          # Delete buildozer's broken SDK and link it to GitHub's real SDK
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          # Also create old tools/bin path that buildozer expects
          mkdir -p $ANDROID_HOME/tools/bin
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/ 2>/dev/null || true
          cp -r $ANDROID_HOME/cmdline-tools/latest/lib $ANDROID_HOME/tools/bin/../ 2>/dev/null || true
          # Double license accept
          yes | $SDK --licenses || true
