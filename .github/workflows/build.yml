name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip unzip zip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev libsqlite3-dev libncurses5 libncursesw5 zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Accept licenses
        run: yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
