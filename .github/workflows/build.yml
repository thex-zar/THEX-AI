name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev libncursesw5-dev zlib1g-dev libltdl-dev libgdbm-dev liblzma-dev tk-dev uuid-dev libreadline-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Accept licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build APK
        run: |
          yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
