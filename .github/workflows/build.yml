name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Android SDK
        run: |
          sudo apt update
          sudo apt install -y aidl
          pip install cython==0.29.36 buildozer==1.5.0
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK --licenses
          $SDK "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl
          sudo chmod +x $ANDROID_HOME/build-tools/33.0.2/aidl
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2
          cp -r $ANDROID_HOME/build-tools/33.0.2/* ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2/
          yes | $SDK --licenses

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
