name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libffi-dev libssl-dev aidl
          pip install cython==0.29.36 buildozer==1.4.0
      - name: Pre-install Android SDK 37 fix
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platform-tools"
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/37.0.0/aidl
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl
          sudo chmod +x $ANDROID_HOME/build-tools/37.0.0/aidl $ANDROID_HOME/build-tools/33.0.2/aidl
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          cp -r $ANDROID_HOME/cmdline-tools/latest/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          cp -r $ANDROID_HOME/cmdline-tools/latest/bin/* $HOME/.buildozer/android/platform/android-sdk/tools/bin/ || true
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2
          cp -r $ANDROID_HOME/build-tools/37.0.0/* $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/ || true
          cp -r $ANDROID_HOME/build-tools/33.0.2/* $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/ || true
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/platforms
          cp -r $ANDROID_HOME/platforms/android-33 $HOME/.buildozer/android/platform/android-sdk/platforms/ || true
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
