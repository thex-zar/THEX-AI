name: build
on:
  push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix SDK
        run: |
          sudo apt update
          sudo apt install -y aidl libffi-dev libssl-dev
          python -m pip install --upgrade pip==23.3.1
          pip install cython==0.29.36 buildozer==1.5.0
          # Force python 3.10
          sudo update-alternatives --install /usr/bin/python3 python3 /opt/hostedtoolcache/Python/3.10.21/x64/bin/python3 100
          python3 --version
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK --licenses
          $SDK "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          # Don't try to install ndk via sdkmanager - use preinstalled one
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl || true
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/tools/bin
          echo '#!/bin/bash' > $ANDROID_HOME/tools/bin/sdkmanager
          echo 'exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"' >> $ANDROID_HOME/tools/bin/sdkmanager
          chmod +x $ANDROID_HOME/tools/bin/sdkmanager
          git clone https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android
          cd ~/.buildozer/android/platform/python-for-android
          git checkout 2024.1.21
          sed -i 's/pip install -U pip/pip install pip==23.3.1/g' pythonforandroid/build.py
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
