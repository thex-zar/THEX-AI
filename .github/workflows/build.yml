name: build
on:
  push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix Android SDK
        run: |
          sudo apt update
          sudo apt install -y aidl libffi-dev libssl-dev
          pip install cython==0.29.36 buildozer==1.5.0
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK --licenses
          $SDK "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          sudo cp /usr/bin/aidl $ANDROID_HOME/build-tools/33.0.2/aidl || true
          sudo chmod +x $ANDROID_HOME/build-tools/33.0.2/aidl || true
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/tools/bin
          cp $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/ || true
          yes | $SDK --licenses || true
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THEX-APK
          path: bin/*.apk
